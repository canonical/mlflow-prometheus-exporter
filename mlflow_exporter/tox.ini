[tox]
skipsdist = True
skip_missing_interpreters = True
envlist = fmt, lint, sanity, integration

[vars]
src_path = {toxinidir}/src/mlflow_exporter.py
tst_path = {toxinidir}/tests/
all_path = {[vars]src_path} {[vars]tst_path}

[testenv]
passenv =
    PYTHONPATH
    CHARM_BUILD_DIR
    MODEL_SETTINGS
    KUBECONFIG
setenv =
    PYTHONPATH = {toxinidir}
    PYTHONBREAKPOINT=ipdb.set_trace
    PY_COLORS=1

[testenv:update-requirements]
allowlist_externals =
    poetry
deps =
    poetry>=2.1.3
    poetry-plugin-export>=1.8.0
commands =
    # Refresh the lock file and re-export the runtime requirements consumed by the rock build.
    poetry lock --directory src
    poetry export --directory src --only main --without-hashes --format requirements.txt --output requirements.txt
description = Update the poetry lock file and re-export src/requirements.txt for the rock build

[testenv:pack]
passenv = *
allowlist_externals =
    rockcraft
deps =
    poetry>=2.1.3
    poetry-plugin-export>=1.8.0
commands_pre =
    # Export the app's locked runtime dependencies for the rock build.
    poetry export --directory src --only main --without-hashes --format requirements.txt --output requirements.txt
commands =
    rockcraft pack
description = Export runtime requirements and pack the rock

[testenv:fmt]
change_dir = {toxinidir}/src
setenv =
    {[testenv]setenv}
    # Make poetry install into the active tox venv instead of creating its own.
    POETRY_VIRTUALENVS_CREATE = false
allowlist_externals =
    poetry
deps =
    poetry>=2.1.3
commands_pre =
    poetry install --only fmt --no-root
commands =
    isort {[vars]all_path}
    black {[vars]all_path}
description = Apply coding style standards to code

[testenv:lint]
change_dir = {toxinidir}/src
setenv =
    {[testenv]setenv}
    # Make poetry install into the active tox venv instead of creating its own.
    POETRY_VIRTUALENVS_CREATE = false
allowlist_externals =
    poetry
deps =
    poetry>=2.1.3
commands_pre =
    poetry install --only lint --no-root
commands =
    codespell {toxinidir}/. --skip {toxinidir}/./.git --skip {toxinidir}/./.tox \
      --skip {toxinidir}/./build --skip {toxinidir}/./lib --skip {toxinidir}/./venv \
      --skip {toxinidir}/./.mypy_cache \
      --skip {toxinidir}/./icon.svg --skip *.json.tmpl
    # pflake8 wrapper supports config from pyproject.toml
    pflake8 {[vars]src_path}
    isort --check-only --diff {[vars]all_path}
    black --check --diff {[vars]all_path}
description = Check code against coding style standards

[testenv:sanity]
passenv = *
change_dir = {toxinidir}/src
setenv =
    {[testenv]setenv}
    # Make poetry install into the active tox venv instead of creating its own.
    POETRY_VIRTUALENVS_CREATE = false
allowlist_externals =
    poetry
deps =
    poetry>=2.1.3
commands_pre =
    # The sanity tests run MLflow and the exporter from the rock image via Docker, so the
    # host only needs lightweight HTTP-check tooling (the `integration` group has no mlflow),
    # which installs on the sanity runner (ubuntu-22.04, Python 3.10).
    poetry install --only integration --no-root
commands =
    pytest -s -v --tb native --show-capture=all --log-cli-level=INFO {posargs} {toxinidir}/tests
description = Run sanity tests against the built rock and the exporter logic against a local MLflow server

[testenv:integration]
allowlist_externals =
    echo
commands =
    # TODO: Implement integration tests here
    echo "WARNING: This is a placeholder test - no test is implemented here."
